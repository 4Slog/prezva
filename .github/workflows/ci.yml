name: CI
# ci: trigger fresh run with updated TRIGGER_SECRET_KEY PAT

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-type-check:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Blocking gate is PRODUCTION dependencies only. A critical in a dev-only tool
      # (e.g. the trigger.dev CLI's transitive node-tar, GHSA-23hp-3jrh-7fpw) cannot
      # reach the deployed app or the Trigger.dev worker runtime — tar is absent from
      # the production dependency graph — and blocking on it produced a red CI that
      # gives no signal (same failure mode as the 2026-07-18 lint broken window).
      # Dev-tree criticals stay VISIBLE in the non-blocking step below, never silent.
      # Verified 2026-07-24 on pnpm 10.34.4: --prod takes 78 findings / 2 critical down
      # to 37 findings / 0 critical and drops the tar advisory entirely.
      - name: Audit production dependencies (blocking)
        run: pnpm audit --audit-level critical --prod
      - name: Audit all dependencies incl. dev (informational, non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level critical
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

  e2e-readonly:
    name: E2E Read-Only
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --reporter=list --grep-invert lifecycle
        env:
          E2E_BASE_URL: https://prezva.app
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # This job is intentionally disabled by default (see the `if:` below).
  # Before this change it reported SUCCESS while executing zero tests: lifecycle.spec.ts
  # self-skips its entire describe block when SUPABASE_SERVICE_ROLE_KEY is absent, so one
  # placeholder test registered, skipped, and the job went green — a false signal. Proven
  # from run 30212733517: "Running 1 test using 1 worker" -> "(skipped) SUPABASE_SERVICE_ROLE_KEY
  # not set" -> "1 skipped".
  #
  # Enabling this job for real requires BOTH:
  #   1. An isolated database — a Supabase branch (priced 2026-07-26 at $0.01344/hour on org
  #      4Slog's Org) — so the fixture writes somewhere other than the database serving prezva.app.
  #   2. An app instance pointed at that database — E2E_BASE_URL below is hardcoded to
  #      https://prezva.app, so an isolated database alone would put the fixture's writes
  #      somewhere the browser under test is not looking.
  #
  # None of the 5 secrets this job's env block references below are currently populated in
  # this repo — only TRIGGER_ACCESS_TOKEN and TRIGGER_SECRET_KEY exist as repo secrets, so
  # E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
  # and SUPABASE_SERVICE_ROLE_KEY are all absent, not just the service role key. fixture.ts alone
  # needs both NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to build its admin client —
  # so flipping this on is not "add one secret," it is five secrets plus the isolated database
  # plus the app instance above.
  #
  # Setting SUPABASE_SERVICE_ROLE_KEY against production is deliberately rejected: this runner
  # installs the full unaudited dependency tree while holding a key that bypasses every RLS policy.
  e2e-lifecycle:
    name: E2E Lifecycle
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: ${{ vars.E2E_LIFECYCLE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test lifecycle --reporter=list
        env:
          E2E_BASE_URL: https://prezva.app
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

